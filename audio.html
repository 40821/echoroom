<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OULEI的伴奏分离工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            color: #1d1d1f;
            background:
                radial-gradient(circle at 12% 12%, rgba(255, 255, 255, 0.98), transparent 24%),
                radial-gradient(circle at 82% 8%, rgba(0, 122, 255, 0.28), transparent 28%),
                radial-gradient(circle at 18% 86%, rgba(52, 199, 89, 0.2), transparent 24%),
                radial-gradient(circle at 82% 82%, rgba(255, 45, 85, 0.16), transparent 24%),
                linear-gradient(145deg, #fbfcff 0%, #eef4fb 42%, #e9edf5 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.54), rgba(255, 255, 255, 0) 34%),
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.72), transparent 32%);
            opacity: 0.82;
            mix-blend-mode: screen;
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 760;
            letter-spacing: 0;
            color: #1d1d1f;
            line-height: 1.08;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.68);
        }

        .header p {
            margin-top: 8px;
            color: #86868b;
            font-size: 15px;
        }

        .glass-card {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.68), rgba(255, 255, 255, 0.36)),
                rgba(255, 255, 255, 0.42);
            backdrop-filter: blur(34px) saturate(180%);
            -webkit-backdrop-filter: blur(34px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.78);
            border-radius: 28px;
            padding: 24px;
            box-shadow:
                0 28px 70px rgba(31, 35, 48, 0.14),
                0 10px 24px rgba(255, 255, 255, 0.42) inset,
                0 1px 0 rgba(255, 255, 255, 0.86) inset;
        }

        .glass-card::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 27px;
            pointer-events: none;
            background:
                linear-gradient(140deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.08) 38%, rgba(255, 255, 255, 0.34) 100%);
            opacity: 0.72;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
            padding: 1px;
        }

        .glass-card::after {
            content: "";
            position: absolute;
            top: -34%;
            left: -18%;
            width: 58%;
            height: 58%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.7), transparent 62%);
            opacity: 0.55;
            transform: rotate(-12deg);
        }

        .glass-card > * {
            position: relative;
            z-index: 1;
        }

        .upload-area {
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 22px;
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1), background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.24)),
                rgba(255, 255, 255, 0.34);
            box-shadow:
                0 10px 28px rgba(31, 35, 48, 0.08),
                0 1px 0 rgba(255, 255, 255, 0.8) inset;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: rgba(0, 122, 255, 0.42);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.68), rgba(245, 250, 255, 0.34)),
                rgba(0, 122, 255, 0.06);
            transform: translateY(-2px) scale(1.005);
            box-shadow:
                0 16px 34px rgba(0, 122, 255, 0.12),
                0 1px 0 rgba(255, 255, 255, 0.9) inset;
        }

        .upload-area:active {
            transform: scale(0.985);
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-area p {
            color: #1d1d1f;
            font-size: 15px;
            font-weight: 500;
        }

        .upload-area .hint {
            margin-top: 6px;
            font-size: 13px;
            color: #86868b;
        }

        .file-name {
            margin-top: 12px;
            font-size: 14px;
            color: #007aff;
            font-weight: 600;
        }

        .status {
            margin-top: 18px;
            padding: 14px;
            border-radius: 18px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.3)),
                rgba(255, 204, 0, 0.14);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.72);
            color: #8a6700;
            font-size: 14px;
            display: none;
            box-shadow:
                0 12px 30px rgba(31, 35, 48, 0.08),
                0 1px 0 rgba(255, 255, 255, 0.82) inset;
        }

        .status.show {
            display: block;
            animation: materialize 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .status.error .progress-shell {
            display: none;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-weight: 650;
        }

        .progress-value {
            min-width: 42px;
            text-align: right;
            color: #007aff;
            font-variant-numeric: tabular-nums;
        }

        .progress-shell {
            height: 9px;
            margin-top: 12px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(118, 118, 128, 0.14);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.72) inset,
                0 8px 16px rgba(31, 35, 48, 0.06) inset;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background:
                linear-gradient(90deg, rgba(0, 122, 255, 0.95), rgba(52, 199, 89, 0.88)),
                #007aff;
            box-shadow:
                0 0 18px rgba(0, 122, 255, 0.32),
                0 1px 0 rgba(255, 255, 255, 0.6) inset;
            transition: width 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .track-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 22px;
        }

        .track-card {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.25)),
                rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(24px) saturate(170%);
            -webkit-backdrop-filter: blur(24px) saturate(170%);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 22px;
            padding: 18px;
            box-shadow:
                0 14px 32px rgba(31, 35, 48, 0.08),
                0 1px 0 rgba(255, 255, 255, 0.8) inset;
        }

        .track-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .track-title::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #007aff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
        }

        .track-card.accompaniment .track-title::before {
            background: #34c759;
            box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.15);
        }

        audio {
            width: 100%;
            height: 42px;
            margin-bottom: 12px;
            border-radius: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #007aff, #0051d5);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 120ms ease-out, box-shadow 180ms ease, background 180ms ease;
            box-shadow: 0 8px 18px rgba(0, 122, 255, 0.22);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(0, 122, 255, 0.28);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            background: #c7c7cc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.16)),
                rgba(118, 118, 128, 0.12);
            color: #1d1d1f;
            border: 1px solid rgba(255, 255, 255, 0.58);
            box-shadow:
                0 8px 18px rgba(31, 35, 48, 0.06),
                0 1px 0 rgba(255, 255, 255, 0.82) inset;
        }

        .btn-secondary:hover {
            background: rgba(118, 118, 128, 0.18);
        }

        .tips {
            margin-top: 22px;
            padding: 18px;
            border-radius: 22px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.25)),
                rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.72);
            font-size: 13px;
            color: #86868b;
            line-height: 1.7;
            box-shadow: 0 10px 26px rgba(31, 35, 48, 0.06);
        }

        .tips strong {
            color: #1d1d1f;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(0, 122, 255, 0.12);
            color: #007aff;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
        }

        @keyframes materialize {
            from {
                opacity: 0;
                transform: scale(0.985) translateY(-4px);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .status.show {
                animation: none;
            }

            .upload-area,
            .btn,
            .progress-bar {
                transition: none;
            }
        }

        @media (prefers-reduced-transparency: reduce) {
            .glass-card,
            .upload-area,
            .status,
            .track-card,
            .tips {
                background: rgba(255, 255, 255, 0.94);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
        }

        @media (max-width: 640px) {
            .track-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }

            .glass-card {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>人声伴奏分离</h1>
            <p>上传立体声音乐，快速分离人声与伴奏</p>
        </div>

        <div class="glass-card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">🎵</div>
                <p>点击或拖拽上传音乐文件</p>
                <p class="hint">支持 MP3、WAV、FLAC，建议使用立体声文件</p>
                <input type="file" id="fileInput" accept="audio/*">
                <div class="file-name" id="fileName"></div>
            </div>

            <div class="status" id="status">
                <div class="status-row">
                    <span id="statusText">正在处理音频，请稍候...</span>
                    <span class="progress-value" id="progressValue">0%</span>
                </div>
                <div class="progress-shell" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressShell">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <div class="track-grid">
                <div class="track-card">
                    <div class="track-title">人声轨道</div>
                    <audio id="vocalAudio" controls></audio>
                    <button class="btn btn-secondary" id="downloadVocal" disabled>下载人声</button>
                </div>

                <div class="track-card accompaniment">
                    <div class="track-title">伴奏轨道</div>
                    <audio id="accompAudio" controls></audio>
                    <button class="btn btn-secondary" id="downloadAccomp" disabled>下载伴奏</button>
                </div>
            </div>

            <div class="tips">
                <p><strong>当前算法说明：</strong></p>
                <p>本工具使用 <span class="badge">中心声道抵消</span> 算法。它适合处理标准立体声流行音乐，可将中央位置的人声与两侧伴奏做初步分离。</p>
                <br>
                <p><strong>为什么人声不够干净？</strong></p>
                <ul style="padding-left: 16px; margin-top: 8px;">
                    <li>底鼓、贝斯、钢琴等中央乐器会残留</li>
                    <li>人声混响和空间效果会被保留</li>
                    <li>单声道文件无法有效分离</li>
                    <li>复杂混音、合唱、环绕声效果会降低质量</li>
                </ul>
                <br>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById("uploadArea");
        const fileInput = document.getElementById("fileInput");
        const fileName = document.getElementById("fileName");
        const status = document.getElementById("status");
        const statusText = document.getElementById("statusText");
        const progressValue = document.getElementById("progressValue");
        const progressShell = document.getElementById("progressShell");
        const progressBar = document.getElementById("progressBar");
        const vocalAudio = document.getElementById("vocalAudio");
        const accompAudio = document.getElementById("accompAudio");
        const downloadVocal = document.getElementById("downloadVocal");
        const downloadAccomp = document.getElementById("downloadAccomp");

        let audioContext = null;
        let originalName = "audio";
        const processingText = statusText.textContent;

        uploadArea.addEventListener("click", () => fileInput.click());

        uploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadArea.classList.add("dragover");
        });

        uploadArea.addEventListener("dragleave", () => {
            uploadArea.classList.remove("dragover");
        });

        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            if (e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener("change", (e) => {
            if (e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            originalName = file.name.replace(/\.[^/.]+$/, "");
            fileName.textContent = file.name;
            setProcessingProgress(4);
            downloadVocal.disabled = true;
            downloadAccomp.disabled = true;

            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const reader = new FileReader();
            reader.onprogress = (e) => {
                if (e.lengthComputable) {
                    setProcessingProgress(4 + Math.round((e.loaded / e.total) * 24));
                }
            };
            reader.onload = async (e) => {
                try {
                    setProcessingProgress(32);
                    const arrayBuffer = e.target.result;
                    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                    setProcessingProgress(46);
                    const separated = await separateAudio(audioBuffer);
                    if (!separated) {
                        return;
                    }
                    setProcessingProgress(100);
                    window.setTimeout(() => status.classList.remove("show"), 520);
                } catch (err) {
                    showProcessingError("处理失败：" + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function separateAudio(buffer) {
            const sampleRate = buffer.sampleRate;
            const length = buffer.length;
            const channels = buffer.numberOfChannels;

            if (channels < 2) {
                alert("请使用立体声文件，单声道文件无法有效分离");
                status.classList.remove("show");
                return false;
            }

            const left = buffer.getChannelData(0);
            const right = buffer.getChannelData(1);

            const vocalBuffer = audioContext.createBuffer(2, length, sampleRate);
            const accompBuffer = audioContext.createBuffer(2, length, sampleRate);

            const vocalL = vocalBuffer.getChannelData(0);
            const vocalR = vocalBuffer.getChannelData(1);
            const accompL = accompBuffer.getChannelData(0);
            const accompR = accompBuffer.getChannelData(1);
            const progressStep = Math.max(4096, Math.floor(length / 80));

            for (let i = 0; i < length; i++) {
                const l = left[i];
                const r = right[i];

                const center = (l + r) * 0.5;
                const side = (l - r) * 0.5;

                vocalL[i] = center * 1.25;
                vocalR[i] = center * 1.25;

                accompL[i] = side * 1.5;
                accompR[i] = -side * 1.5;

                if (i % progressStep === 0) {
                    setProcessingProgress(46 + Math.round((i / length) * 36));
                    await nextFrame();
                }
            }

            setProcessingProgress(84);
            const vocalUrl = bufferToWaveUrl(vocalBuffer);
            setProcessingProgress(92);
            const accompUrl = bufferToWaveUrl(accompBuffer);

            vocalAudio.src = vocalUrl;
            accompAudio.src = accompUrl;

            downloadVocal.disabled = false;
            downloadAccomp.disabled = false;

            downloadVocal.onclick = () => downloadAudio(vocalUrl, originalName + "_vocal.wav");
            downloadAccomp.onclick = () => downloadAudio(accompUrl, originalName + "_accompaniment.wav");
            return true;
        }

        function setProcessingProgress(value) {
            const progress = Math.max(0, Math.min(100, Math.round(value)));
            status.classList.remove("error");
            status.classList.add("show");
            statusText.textContent = processingText;
            progressValue.textContent = progress + "%";
            progressBar.style.width = progress + "%";
            progressShell.setAttribute("aria-valuenow", progress);
        }

        function showProcessingError(message) {
            status.classList.add("show", "error");
            statusText.textContent = message;
            progressValue.textContent = "";
        }

        function nextFrame() {
            return new Promise((resolve) => requestAnimationFrame(resolve));
        }

        function bufferToWaveUrl(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1;
            const bitDepth = 16;

            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const dataLength = buffer.length * blockAlign;
            const bufferLength = 44 + dataLength;

            const arrayBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(arrayBuffer);

            writeString(view, 0, "RIFF");
            view.setUint32(4, 36 + dataLength, true);
            writeString(view, 8, "WAVE");
            writeString(view, 12, "fmt ");
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, "data");
            view.setUint32(40, dataLength, true);

            const channels = [];
            for (let i = 0; i < numChannels; i++) {
                channels.push(buffer.getChannelData(i));
            }

            let offset = 44;
            for (let i = 0; i < buffer.length; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    let sample = Math.max(-1, Math.min(1, channels[ch][i]));
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset, sample, true);
                    offset += 2;
                }
            }

            const blob = new Blob([arrayBuffer], { type: "audio/wav" });
            return URL.createObjectURL(blob);
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function downloadAudio(url, filename) {
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();
        }
    </script>
</body>
</html>
